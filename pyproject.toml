[project]
name = "httptv"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests", "accounts", "shows"]
