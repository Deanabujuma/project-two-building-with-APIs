{% load static %}<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HTTP.tv{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0B0F'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='16' text-anchor='middle' fill='%23F9F9F9'%3Etv%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/httptv.css' %}" rel="stylesheet">
</head>
<body>
  {% include "includes/nav.html" %}

  {% if messages %}
    <div class="messages" role="status" aria-live="polite">
      {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
    </div>
  {% endif %}

  <main>{% block content %}{% endblock %}</main>

  {% include "includes/footer.html" %}
  {% block scripts %}{% endblock %}
</body>
</html>
