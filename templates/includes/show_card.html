{# The shared poster card. Context: show (Show or dict), entry (CollectionEntry or None), href (optional). #}
{% load show_display %}
<div class="art">
  {% if show.image_url %}<img src="{{ show.image_url }}" alt="{{ show.name }} poster" loading="lazy">{% else %}<div class="fallback-art">{{ show.name|initial }}</div>{% endif %}
  <div class="hover-cta"><span>{{ cta|default:"MORE INFO" }}</span></div>
</div>
<div class="cap-t clamp-1">{{ show.name }}</div>
<div class="cap-s"><i class="bi bi-plus-circle"></i>Not in your collection</div>
<div class="cap-p">{{ show|identity_line }}</div>
